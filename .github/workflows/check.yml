name: Check JavaScript
on:
  push:
    branches: [main]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Verify game entry files
        run: |
          test -f index.html
          test -f src/main.js
          test -f src/scenes/WorldScene.js
          test -f src/scenes/UIScene.js
          test -f src/entities/Player.js
          test -f src/entities/NPC.js
          test -f src/systems/CookingSystem.js
          test -f src/systems/QuestSystem.js
          test -f src/systems/CookingMinigame.js
          test -f src/systems/GardenSystem.js
          test -f src/world/GardenArt.js
          test -f tests/garden.test.mjs
          test -f src/systems/DailyLifeSystem.js
          test -f src/world/FarmArt.js
          test -f tests/daily-life.test.mjs
          test -f src/systems/SocialSystem.js
          test -f tests/social.test.mjs
          test -f src/systems/LearningSystem.js
          test -f tests/learning.test.mjs
          test -f src/systems/TimeWeatherSystem.js
          test -f src/world/WeatherArt.js
          test -f tests/time-weather.test.mjs
          test -f src/world/ShelterRoutes.js
          test -f tests/shelters.test.mjs
          test -f src/systems/MissionSystem.js
          test -f tests/missions.test.mjs
      - name: Run system regression tests
        run: node --test tests/*.test.mjs

  browser:
    name: Desktop and mobile browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run end-to-end smoke tests
        run: node tests/browser-smoke.mjs
      - name: Upload desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-browser-screenshots
          path: qa-artifacts/
          if-no-files-found: ignore
