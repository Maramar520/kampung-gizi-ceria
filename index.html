<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kampung Gizi Ceria — Phaser v0.3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9eddc;color:#415644;font:14px system-ui,sans-serif}header{text-align:center;padding:10px}h1{margin:0;color:#4c7958;font-size:24px}header p{margin:3px}.shell{max-width:1060px;margin:auto;padding:8px}.hud{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-bottom:8px}.chip{background:#fff9e9;border:2px solid #b7cda8;border-radius:10px;padding:8px;text-align:center;font-weight:700}.chip small{display:block;color:#7b8b75;font-weight:500}.gamewrap{position:relative;border:6px solid #6e9670;border-radius:14px;overflow:hidden}#game canvas{display:block;width:100%;image-rendering:pixelated}.toast{position:absolute;top:9px;left:50%;transform:translateX(-50%);background:#fff8e9;border:2px solid #a6bd87;border-radius:8px;padding:7px 12px;text-align:center;pointer-events:none;max-width:95%;font-weight:bold}.bottom{display:flex;gap:8px;margin:10px 0;align-items:center}.quest{background:#fff8e5;border:2px solid #c6d5b0;padding:10px;border-radius:10px;flex:1}button{background:#64976b;color:white;border:0;border-bottom:3px solid #477a51;border-radius:9px;padding:10px 15px;font-weight:700;cursor:pointer}.controls{display:flex;justify-content:center;gap:14px;align-items:center;margin:8px}.dpad{display:grid;grid-template-columns:repeat(3,45px);grid-template-rows:repeat(2,40px);gap:3px;touch-action:none}.dpad button{padding:0;font-size:20px}.dpad [data-dir=up]{grid-column:2}.dpad [data-dir=left]{grid-column:1;grid-row:2}.dpad [data-dir=down]{grid-column:2;grid-row:2}.dpad [data-dir=right]{grid-column:3;grid-row:2}.modal{position:absolute;inset:0;background:#243f31a8;display:flex;align-items:center;justify-content:center;padding:12px}.hidden{display:none!important}.panel{background:#fff7e8;border:5px solid #b88561;border-radius:14px;padding:17px;width:min(520px,100%);max-height:95%;overflow:auto}.panel h2{margin:0 0 8px;color:#80583c}.panel p{line-height:1.6}.choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.choices button{flex:1;min-width:130px}.close{float:right;background:#b17a64}.cookstage{background:#f0e1c8;padding:12px;border-radius:10px;margin:10px 0;text-align:center}.progress{height:12px;background:#d2c3a6;border-radius:8px;overflow:hidden}.progress div{height:100%;background:#79ad7b;transition:width .15s}@media(max-width:700px){.hud{grid-template-columns:repeat(3,1fr)}.chip{font-size:12px}.bottom{flex-wrap:wrap}}
</style>
</head>
<body>
<header><h1>🌿 Kampung Gizi Ceria <small>Phaser v0.3</small></h1><p>Interior terbuka · NPC bergerak · Quest dan memasak</p></header>
<main class="shell">
<section class="hud">
<div class="chip">🪙 <span id="coins"></span><small>Koin</small></div>
<div class="chip">⚡ <span id="energy"></span><small>Energi</small></div>
<div class="chip">🍚 <span id="carb"></span><small>Karbo</small></div>
<div class="chip">🥚 <span id="protein"></span><small>Protein</small></div>
<div class="chip">🥬 <span id="vitamin"></span><small>Vitamin</small></div>
<div class="chip">🌤️ <span id="day"></span> · <span id="status"></span><small>Hari / Status</small></div>
</section>
<div class="gamewrap">
<div id="game"></div>
<div class="toast" id="toast">WASD / panah untuk bergerak • E untuk interaksi</div>
<div class="modal hidden" id="dialog"><div class="panel">
<button class="close" id="close">✕</button><h2 id="dialogTitle"></h2>
<p id="message"></p><div id="cookVisual"></div><div class="choices" id="choices"></div>
</div></div>
</div>
<div class="bottom"><div class="quest" id="quest"></div><button id="reset">↺ Reset progres</button></div>
<div class="controls"><div class="dpad">
<button data-dir="up">▲</button><button data-dir="left">◀</button>
<button data-dir="down">▼</button><button data-dir="right">▶</button></div>
<button id="action">✨ AKSI / E</button></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
