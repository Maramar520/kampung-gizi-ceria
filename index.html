<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kampung Gizi Ceria — Phaser v0.7</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9eddc;color:#415644;font:14px system-ui,sans-serif}header{text-align:center;padding:10px}h1{margin:0;color:#4c7958;font-size:24px}header p{margin:3px}.shell{max-width:1060px;margin:auto;padding:8px}.hud{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-bottom:8px}.chip{background:#fff9e9;border:2px solid #b7cda8;border-radius:10px;padding:8px;text-align:center;font-weight:700}.chip small{display:block;color:#7b8b75;font-weight:500}.gamewrap{position:relative;border:6px solid #6e9670;border-radius:14px;overflow:hidden}#game canvas{display:block;width:100%;image-rendering:pixelated}.toast{position:absolute;top:9px;left:50%;transform:translateX(-50%);background:#fff8e9;border:2px solid #a6bd87;border-radius:8px;padding:7px 12px;text-align:center;pointer-events:none;max-width:95%;font-weight:bold}.bottom{display:flex;gap:8px;margin:10px 0;align-items:center}.quest{background:#fff8e5;border:2px solid #c6d5b0;padding:10px;border-radius:10px;flex:1}button{background:#64976b;color:white;border:0;border-bottom:3px solid #477a51;border-radius:9px;padding:10px 15px;font-weight:700;cursor:pointer}.controls{display:flex;justify-content:center;gap:14px;align-items:center;margin:8px}.dpad{display:grid;grid-template-columns:repeat(3,45px);grid-template-rows:repeat(2,40px);gap:3px;touch-action:none}.dpad button{padding:0;font-size:20px}.dpad [data-dir=up]{grid-column:2}.dpad [data-dir=left]{grid-column:1;grid-row:2}.dpad [data-dir=down]{grid-column:2;grid-row:2}.dpad [data-dir=right]{grid-column:3;grid-row:2}.modal{position:absolute;inset:0;background:#243f31a8;display:flex;align-items:center;justify-content:center;padding:12px}.hidden{display:none!important}.panel{background:#fff7e8;border:5px solid #b88561;border-radius:14px;padding:17px;width:min(520px,100%);max-height:95%;overflow:auto}.panel h2{margin:0 0 8px;color:#80583c}.panel p{line-height:1.6}.choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.choices button{flex:1;min-width:130px}.close{float:right;background:#b17a64}.cookstage{background:#f0e1c8;padding:12px;border-radius:10px;margin:10px 0;text-align:center}.progress{height:12px;background:#d2c3a6;border-radius:8px;overflow:hidden}.progress div{height:100%;background:#79ad7b;transition:width .15s}@media(max-width:700px){.hud{grid-template-columns:repeat(3,1fr)}.chip{font-size:12px}.bottom{flex-wrap:wrap}}

/* === v0.5: antarmuka memasak ramah keyboard, mouse dan sentuhan === */
.panel{box-shadow:0 12px 0 #694d38,0 24px 52px #263f3270}
.panel h2{font-size:22px}.panel button:focus-visible,.controls button:focus-visible{outline:3px solid #edb962;outline-offset:3px}
.mini-stage{background:#f5e3c3;border:3px solid #bc936d;border-radius:13px;padding:15px;text-align:center;margin-top:12px}
.mini-art{height:106px;display:flex;align-items:center;justify-content:center;position:relative;background:linear-gradient(180deg,#fff2d6 0%,#f1d8ae 100%);border:3px solid #d2ad82;border-radius:12px;overflow:hidden}
.mini-food{font-size:64px;display:inline-block;filter:drop-shadow(3px 5px 0 #b49976)}
.mini-water,.mini-steam{position:absolute;font-size:20px;top:5px;right:20%;animation:miniFloat 1.4s ease-in-out infinite alternate}
.mini-egg{animation:miniBob .85s ease-in-out infinite alternate}
.mini-pot{animation:miniBob 1.15s ease-in-out infinite alternate}
.mini-stage p{font-size:14px;line-height:1.5;margin:10px 0}
.mini-meter{height:17px;border:3px solid #b18b66;border-radius:12px;background:#fff7df;overflow:hidden}
#miniFill{height:100%;width:0;background:repeating-linear-gradient(90deg,#75b581 0 15px,#96cb8c 15px 21px);transition:width .1s}
.mini-count{font-weight:700;color:#5b7655;min-height:20px}
button.mini-button{display:block;width:100%;font-size:16px;padding:15px;background:#69986d;user-select:none;touch-action:none}
button.mini-button.is-holding{background:#c38459;transform:translateY(2px)}
.timing-track{height:29px;position:relative;border:3px solid #9c805d;border-radius:8px;background:#e7b9a1;margin:12px 4px;overflow:hidden}
.timing-target{position:absolute;left:37%;width:26%;height:100%;background:#88b983}
.timing-marker{position:absolute;left:0;top:0;height:100%;width:6px;background:#614c44;transform:translateX(-50%);box-shadow:0 0 0 2px #fff6e3}
.wobble{animation:miniWobble .3s ease-out}
@keyframes miniBob{from{transform:translateY(2px) rotate(-3deg)}to{transform:translateY(-5px) rotate(3deg)}}
@keyframes miniFloat{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:translateY(-7px)}}
@keyframes miniWobble{0%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}100%{transform:rotate(0)}}
@media(max-width:600px){.modal{padding:6px}.panel{padding:12px}.mini-art{height:83px}.mini-food{font-size:48px}button.mini-button{padding:16px}}

/* v0.6: bantuan navigasi dan pilihan pemulihan posisi */
#unstuck{background:#8d9e6d;border-bottom-color:#667a50}.quest{line-height:1.5}@media(max-width:700px){#unstuck,#reset{flex:1;min-width:130px}}

/* === v0.7 : menu pemain yang mudah dibaca anak SD === */
.notebook-shortcuts{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.notebook-shortcuts button{background:#faf2db;color:#567452;border:2px solid #b8cda8;border-bottom:4px solid #8fa980;padding:10px 18px;font-size:16px}
.notebook-shortcuts button small{font-size:11px;opacity:.7;margin-left:6px}
.notebook-overlay{position:absolute;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;padding:12px;background:#263d31b8}
.notebook-panel{background:#fff7e7;border:5px solid #9e7e60;border-radius:16px;box-shadow:0 12px 0 #6c523c,0 20px 35px #172b2190;width:min(660px,100%);max-height:92%;display:flex;flex-direction:column;overflow:hidden}
.notebook-header{display:flex;justify-content:space-between;align-items:center;padding:12px 15px;background:#e7d4b7}
.notebook-header h2{font-size:22px;margin:0;color:#6b4d3c}
#notebookClose{background:#af7568;min-width:46px}
.notebook-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:8px 10px 0}
.notebook-tabs button{padding:12px 4px;background:#dac9ae;color:#614f3c;border-radius:9px 9px 0 0;font-size:15px}
.notebook-tabs button.selected{background:#78a27b;color:#fff}
.notebook-content{overflow-y:auto;padding:14px;min-height:180px}
.notebook-note{line-height:1.5;margin:4px 0 14px;color:#706456}
.notebook-tip{background:#e6f0da;border-left:5px solid #8ba980;padding:10px;border-radius:8px;line-height:1.5}
.inventory-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.item-card{border:3px solid #a0c093;border-radius:13px;background:#f5f8e9;display:flex;align-items:center;flex-direction:column;gap:6px;padding:14px 6px;text-align:center}
.item-card.empty{background:#eee8df;border-color:#d5ccba;color:#938b7d}
.item-emoji,.recipe-emoji{font-size:42px;line-height:1.4}
.item-card strong{font-size:16px}
.item-count{border-radius:12px;background:#7f9e70;color:white;padding:4px 11px;font-size:13px}
.item-card.empty .item-count{background:#b7ae9c}
.item-card small{font-size:11px}
.recipe-cover{display:flex;gap:15px;align-items:center;background:#f4e6cc;padding:12px;border-radius:12px}
.recipe-emoji{font-size:60px}.recipe-info h3{font-size:20px;margin:0}.recipe-status{margin:4px 0;color:#5c865a;font-weight:700}
.notebook-section{margin:15px 0 8px;color:#775842;font-size:16px}
.ingredient-grid{display:grid;gap:7px}.ingredient{display:flex;justify-content:space-between;align-items:center;border:2px solid #dbad93;border-radius:10px;padding:10px;background:#fff0e7}
.ingredient.enough{border-color:#94b98a;background:#eff7e8}.ingredient b{white-space:nowrap}
.recipe-steps{padding-left:24px;line-height:1.8}
.quest-steps{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.quest-step{display:flex;gap:11px;padding:11px;background:#f3eadc;border:2px solid #d7c6aa;border-radius:10px}
.quest-step.done{background:#e4f0db;border-color:#9eba94}.quest-step.current{border-color:#d69a55;background:#fff4d9}
.step-mark{font-size:22px;font-weight:900;min-width:28px;text-align:center;color:#9f8059}
.quest-step.done .step-mark{color:#518753}.quest-step.current .step-mark{color:#b17d31}
.quest-copy{display:grid;gap:4px}.quest-copy small{line-height:1.4;color:#786b59}
.notebook-footer{text-align:center;font-size:12px;color:#8d7b66;background:#f0e3ce;padding:8px}
.notebook-panel button:focus-visible,.notebook-shortcuts button:focus-visible{outline:3px solid #e9ac51;outline-offset:2px}
@media(max-width:650px){.notebook-overlay{padding:5px}.notebook-header h2{font-size:18px}.notebook-panel{max-height:96%}.inventory-grid{gap:5px}.item-card{padding:10px 3px}.item-emoji{font-size:31px}.item-card strong{font-size:13px}.notebook-tabs button{font-size:12px}.notebook-content{padding:9px}}
</style>
</head>
<body>
<header><h1>🌿 Kampung Gizi Ceria <small>Phaser v0.7</small></h1><p>Cozy pixel art v0.7 · Tas, buku resep, jurnal quest</p></header>
<main class="shell">
<section class="hud">
<div class="chip">🪙 <span id="coins"></span><small>Koin</small></div>
<div class="chip">⚡ <span id="energy"></span><small>Energi</small></div>
<div class="chip">🍚 <span id="carb"></span><small>Karbo</small></div>
<div class="chip">🥚 <span id="protein"></span><small>Protein</small></div>
<div class="chip">🥬 <span id="vitamin"></span><small>Vitamin</small></div>
<div class="chip">🌤️ <span id="day"></span> · <span id="status"></span><small>Hari / Status</small></div>
</section>
<nav class="notebook-shortcuts" aria-label="Menu pemain">
<button type="button" data-open-notebook="inventory" title="Tas bahan (I)">🎒 Tas <small>I</small></button>
<button type="button" data-open-notebook="recipes" title="Buku resep (R)">📖 Resep <small>R</small></button>
<button type="button" data-open-notebook="journal" title="Jurnal quest (J)">📋 Misi <small>J</small></button>
</nav>
<div class="gamewrap">
<div id="game"></div>
<div class="toast" id="toast">WASD / panah untuk bergerak • E untuk interaksi</div>
<section id="notebook" class="notebook-overlay hidden" aria-hidden="true" aria-label="Buku pemain">
 <div class="notebook-panel" role="dialog" aria-modal="true" aria-labelledby="notebookTitle">
  <header class="notebook-header"><h2 id="notebookTitle">🎒 Tas Bahan</h2>
   <button type="button" id="notebookClose" aria-label="Tutup buku">✕</button></header>
  <div class="notebook-tabs" role="tablist" aria-label="Bagian buku pemain">
   <button type="button" role="tab" data-tab="inventory">🎒 Tas</button>
   <button type="button" role="tab" data-tab="recipes">📖 Resep</button>
   <button type="button" role="tab" data-tab="journal">📋 Misi</button>
  </div>
  <div id="notebookContent" class="notebook-content" aria-live="polite"></div>
  <footer class="notebook-footer">Kampung Gizi Ceria • Tekan Esc untuk menutup</footer>
 </div>
</section>
<div class="modal hidden" id="dialog"><div class="panel">
<button class="close" id="close">✕</button><h2 id="dialogTitle"></h2>
<p id="message"></p><div id="cookVisual"></div><div class="choices" id="choices"></div>
</div></div>
</div>
<div class="bottom"><div class="quest" id="quest"></div><button id="unstuck" type="button" title="Pindahkan karakter ke jalan, tanpa menghapus progres">↩ Kembali ke jalan</button><button id="reset">↺ Reset progres</button></div>
<div class="controls"><div class="dpad">
<button data-dir="up">▲</button><button data-dir="left">◀</button>
<button data-dir="down">▼</button><button data-dir="right">▶</button></div>
<button id="action">✨ AKSI / E</button></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
